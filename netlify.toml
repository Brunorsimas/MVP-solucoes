# Shared pilot: frontend + private PostgreSQL API.
[build]
  base = "."
  command = "npm run build:shared"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Public service URLs; database credentials stay inside Neon Functions.
  NEON_AUTH_BASE_URL = "https://ep-quiet-grass-b4esd0a1.neonauth.c-6.us-east-2.aws.neon.tech/neondb/auth"
  NEON_FUNCTION_HELLO_BASE_URL = "https://br-lingering-bonus-b4ixzdjv-hello.compute.c-6.us-east-2.aws.neon.tech/"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://ep-quiet-grass-b4esd0a1.neonauth.c-6.us-east-2.aws.neon.tech https://br-lingering-bonus-b4ixzdjv-hello.compute.c-6.us-east-2.aws.neon.tech; frame-src https://ep-quiet-grass-b4esd0a1.neonauth.c-6.us-east-2.aws.neon.tech; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
