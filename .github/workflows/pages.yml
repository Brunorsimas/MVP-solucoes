name: Testar e preparar demonstracao

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Publicar no GitHub Pages já configurado (verifique a visibilidade do site)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: https://brunorsimas.github.io/MVP-solucoes
      - uses: actions/upload-artifact@v4
        with:
          name: mvp-solucoes-demonstracao
          path: dist
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
